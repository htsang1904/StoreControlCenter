name: Deploy to production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          printf '%s\n' "$APP_ENV" > .env.production
          npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy through SSH
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '$DEPLOY_PATH' '$FRONTEND_PATH' && chmod 750 '$DEPLOY_PATH'"

          printf '%s\n' "$APP_ENV" | ssh \
            -i ~/.ssh/deploy_key \
            -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "umask 077; cat > '$DEPLOY_PATH/.env'"

      - name: Upload backend source to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o BatchMode=yes" \
            python-api/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/python-api/"

          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o BatchMode=yes" \
            docker-compose.backend.yml \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/docker-compose.backend.yml"

      - name: Upload frontend build to web root
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FRONTEND_PATH: ${{ secrets.FRONTEND_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.user.ini' \
            --exclude='python-api/' \
            --exclude='docker-compose.backend.yml' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o BatchMode=yes" \
            dist/ "${SSH_USER}@${SSH_HOST}:${FRONTEND_PATH}/"

      - name: Build and restart Docker services
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE_SCRIPT'
              set -Eeuo pipefail

              cd "$DEPLOY_PATH"
              test -s .env
              test -f docker-compose.backend.yml
              docker compose -f docker-compose.backend.yml config --quiet
              docker compose -f docker-compose.backend.yml build --pull
              docker compose -f docker-compose.backend.yml up -d --remove-orphans
              docker compose -f docker-compose.backend.yml ps

              backend_ready=0
              for attempt in $(seq 1 30); do
                if curl --fail --silent --show-error \
                  --connect-timeout 5 \
                  "http://127.0.0.1:${BACKEND_PORT:-8001}/" \
                  >/dev/null; then
                  backend_ready=1
                  break
                fi

                echo "Backend is not ready yet (attempt ${attempt}/30)."
                sleep 3
              done

              if [ "$backend_ready" -ne 1 ]; then
                docker compose -f docker-compose.backend.yml logs --tail=100 backend
                exit 1
              fi
          REMOTE_SCRIPT
