name: Deploy to production

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy through SSH
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Prepare deployment directory
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '$DEPLOY_PATH' && chmod 750 '$DEPLOY_PATH'"

          printf '%s\n' "$APP_ENV" | ssh \
            -i ~/.ssh/deploy_key \
            -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "umask 077; cat > '$DEPLOY_PATH/.env'"

      - name: Upload source to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.user.ini' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT:-22} -o BatchMode=yes" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Build and restart Docker services
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            "${SSH_USER}@${SSH_HOST}" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -se" <<'REMOTE_SCRIPT'
              set -Eeuo pipefail

              cd "$DEPLOY_PATH"
              test -s .env
              test -f docker-compose.yml
              docker compose config --quiet
              docker compose build --pull
              docker compose up -d --remove-orphans
              docker compose ps

              if ! curl --fail --silent --show-error \
                --connect-timeout 5 \
                --retry 30 \
                --retry-delay 3 \
                --retry-all-errors \
                "http://127.0.0.1:${BACKEND_PORT:-8001}/" \
                >/dev/null; then
                docker compose logs --tail=100 backend
                exit 1
              fi
          REMOTE_SCRIPT
