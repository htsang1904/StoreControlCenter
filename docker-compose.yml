services:
  db:
    image: postgres:15-alpine
    container_name: store_control_center_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    container_name: store_control_center_backend
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - SUITE_API=${SUITE_API:-https://lab-sapi.guta.asia}
      - MAIN_STORE_SYNC_URL=${MAIN_STORE_SYNC_URL:-https://gapi.guta.asia/webapi/stores?all_stores=true}
      - SUITE_VERIFY_TOKEN=${SUITE_VERIFY_TOKEN:-false}
      - SUITE_PUBLIC_KEY_FILE=${SUITE_PUBLIC_KEY_FILE:-}
      - ENABLE_SQLADMIN=${ENABLE_SQLADMIN:-false}
      - SQLADMIN_USERNAME=${SQLADMIN_USERNAME:-}
      - SQLADMIN_PASSWORD=${SQLADMIN_PASSWORD:-}
      - SQLADMIN_SESSION_SECRET=${SQLADMIN_SESSION_SECRET:-}
      - ENABLE_BOOTSTRAP_ADMIN=${ENABLE_BOOTSTRAP_ADMIN:-true}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL}
      - BOOTSTRAP_ADMIN_NAME=${BOOTSTRAP_ADMIN_NAME:-System Administrator}
      - BOOTSTRAP_ADMIN_PHONE_NUMBER=${BOOTSTRAP_ADMIN_PHONE_NUMBER:-}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-}
      - ONESIGNAL_APP_ID=${ONESIGNAL_APP_ID:-}
      - ONESIGNAL_REST_API_KEY=${ONESIGNAL_REST_API_KEY:-}
      - ONESIGNAL_API_URL=${ONESIGNAL_API_URL:-https://api.onesignal.com/notifications}
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
    command: sh ./scripts/start-dev.sh
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./python-api:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: store_control_center_frontend
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_AUTH_URL=${VITE_AUTH_URL:-}
      - VITE_APP_VERSION=${VITE_APP_VERSION:-}
      - VITE_DEFAULT_STORE_ID=${VITE_DEFAULT_STORE_ID:-}
      - VITE_DEFAULT_STORE_NAME=${VITE_DEFAULT_STORE_NAME:-}
      - VITE_ONESIGNAL_APP_ID=${VITE_ONESIGNAL_APP_ID:-}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    # This mounts the current folder in so you get hot-reloading when modifying Vue files
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:
