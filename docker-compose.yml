version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: store_control_center_db
    env_file:
      - .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store_control_center
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    container_name: store_control_center_backend
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=store_control_center
      - POSTGRES_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-change_me_in_production}
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
    command: uvicorn app.main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8001} --reload
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./python-api:/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: store_control_center_frontend
    env_file:
      - .env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    depends_on:
      - backend
    # This mounts the current folder in so you get hot-reloading when modifying Vue files
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  db_data:
  frontend_node_modules:
